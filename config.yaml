# 分類規則：依序比對標題（標題沒中才看內文），可同時屬於多類；
# 報告中依第一個符合的分類分組，所以越「特定」的分類放越前面。
categories:
  "隊伍建造紀錄":
    ["build thread", "open alliance", "build blog"]
  "軟體更新":
    [wpilib, software, firmware, phoenix, revlib, advantagekit, photonvision, "driver station",
     vscode, robotpy, labview, imager, library, vendordep, " api", java, "c++", python,
     alpha, beta, " sim ", simulation, code]
  "硬體/控制系統":
    [systemcore, roborio, hardware, motor, controller, radio, battery, " pdh ", pneumatic,
     sensor, "legal device", "kit of parts", kitbot, cots, camera, limelight, product]
  "規則/比賽手冊":
    ["game manual", " rule", "team update", "q&a", biocore, inspection, bumper, penalty,
     manual, "game animation", " field", "game reveal"]
  "行政/賽事":
    [registration, fee, deadline, event, district, championship, schedule, award,
     volunteer, grant, kickoff, calendar, policy]
