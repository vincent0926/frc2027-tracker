    url: "https://www.chiefdelphi.com/tag/wpilib.rss"
    filter: relevant

  - id: cd_tag_programming
    name: "Chief Delphi #programming（程式，篩選 2027 相關）"
    type: feed
    url: "https://www.chiefdelphi.com/tag/programming.rss"
    filter: relevant

  - id: cd_tag_rev
    name: "Chief Delphi #rev（REV，篩選 2027 相關）"
    type: feed
    url: "https://www.chiefdelphi.com/tag/rev.rss"
    filter: relevant

  - id: cd_tag_ctre
    name: "Chief Delphi #ctre（CTRE，篩選 2027 相關）"
    type: feed
    url: "https://www.chiefdelphi.com/tag/ctre.rss"
    filter: relevant

  - id: cd_tag_photonvision
