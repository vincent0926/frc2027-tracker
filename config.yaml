# FRC 2027 變更追蹤器設定檔
# 想新增來源，照下面的格式加一筆即可。

user_agent: "frc2027-tracker/0.1 (personal FRC season-change monitor)"
request_delay_seconds: 2      # 每次請求之間的間隔（對網站禮貌）
timeout_seconds: 30

# 「2027 相關」判斷關鍵字（不分大小寫，任一出現即算）
relevance_keywords:
  - "2027"
  - "systemcore"
  - "motioncore"
  - "biocore"

sources:
  # ---------- FIRST 官方 ----------
  - id: first_blog
    name: "FIRST 官方部落格 (RSS)"
    type: feed
    url: "https://www.firstinspires.org/community-blog/rss.xml"
    filter: relevant           # relevant = 只保留含關鍵字的；all = 全收

  - id: first_frc_blog
    name: "FIRST 官方部落格 FRC 分類頁"
    type: page
    url: "https://www.firstinspires.org/community-blog/topic/frc"

  - id: frc_season_materials
    name: "FRC Season Materials（手冊、Team Update、規則文件）"
    type: page
    url: "https://www.firstinspires.org/resources/library/frc/season-materials"
    ignore_links: ["calendar.google.com"]   # 「加入行事曆」按鈕不算變動
    calendar: true                          # 從行事曆按鈕擷取官方重要日期

  # ---------- 軟體 ----------
  - id: wpilib_new_for_2027
    name: "WPILib 文件：New for 2027"
    type: page
    url: "https://docs.wpilib.org/en/latest/docs/yearly-overview/yearly-changelog.html"
    selector: "article"        # 只看主要內容區塊

  - id: wpilib_releases
    name: "WPILib (allwpilib) GitHub Releases"
    type: feed
    url: "https://github.com/wpilibsuite/allwpilib/releases.atom"
    filter: relevant

  - id: ctre_releases
    name: "CTRE Phoenix Releases"
    type: feed
    url: "https://github.com/CrossTheRoadElec/Phoenix-Releases/releases.atom"
    filter: relevant

  - id: rev_releases
    name: "REV Software Binaries Releases"
    type: feed
    url: "https://github.com/REVrobotics/REV-Software-Binaries/releases.atom"
    filter: relevant

  - id: photonvision_releases
    name: "PhotonVision Releases"
    type: feed
    url: "https://github.com/PhotonVision/photonvision/releases.atom"
    filter: relevant

  - id: advantagekit_releases
    name: "AdvantageKit Releases"
    type: feed
    url: "https://github.com/Mechanical-Advantage/AdvantageKit/releases.atom"
    filter: relevant

  # ---------- SystemCore ----------
  - id: wpilib_systemcore_intro
    name: "WPILib 文件：Systemcore Introduction"
    type: page
    url: "https://docs.wpilib.org/en/latest/docs/software/systemcore-info/systemcore-introduction.html"
    selector: "article"

  - id: wpilib_systemcore_imaging
    name: "WPILib 文件：Imaging your Systemcore"
    type: page
    url: "https://docs.wpilib.org/en/latest/docs/zero-to-robot/step-3/imaging-your-systemcore.html"
    selector: "article"

  - id: systemcore_testing_readme
    name: "SystemCoreTesting README（相容表、已知問題、快速上手）"
    type: page
    url: "https://github.com/wpilibsuite/SystemCoreTesting"
    selector: "article"

  - id: systemcore_testing_commits
    name: "SystemCoreTesting 更新紀錄"
    type: feed
    url: "https://github.com/wpilibsuite/SystemCoreTesting/commits/main.atom"
    filter: all

  # ---------- 社群 ----------
  - id: cd_latest
    name: "Chief Delphi 最新討論（篩選 2027 相關）"
    type: feed
    url: "https://www.chiefdelphi.com/latest.rss"
    filter: relevant

  - id: cd_tag_2027
    name: "Chief Delphi 標籤 #2027"
    type: feed
    url: "https://www.chiefdelphi.com/tag/2027.rss"
    filter: all

  - id: cd_tag_systemcore
    name: "Chief Delphi 標籤 #systemcore"
    type: feed
    url: "https://www.chiefdelphi.com/tag/systemcore.rss"
    filter: all

  - id: cd_tag_frc_blog
    name: "Chief Delphi #frc-blog（官方 FRC Blog 轉貼）"
    type: feed
    url: "https://www.chiefdelphi.com/tag/frc-blog.rss"
    filter: all

  - id: cd_tag_rules
    name: "Chief Delphi #rules（規則討論，篩選 2027 相關）"
    type: feed
    url: "https://www.chiefdelphi.com/tag/rules.rss"
    filter: relevant

  - id: cd_tag_kickoff
    name: "Chief Delphi #kickoff（Kickoff，篩選 2027 相關）"
    type: feed
    url: "https://www.chiefdelphi.com/tag/kickoff.rss"
    filter: relevant

  - id: cd_tag_wpilib
    name: "Chief Delphi #wpilib（WPILib，篩選 2027 相關）"
