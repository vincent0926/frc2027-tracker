<title>FRC 2027 情報站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 版面概念：比賽現場 pit 公告板。頂部倒數條 → 今日精選（紅聯盟條）→ 重點整理格 → 全部訊息清單 */
:root {
  --bg: #eef1f4;          /* 場地灰 */
  --panel: #ffffff;
  --ink: #15212c;
  --muted: #5b6876;
  --line: #d5dce3;
  --blue: #1d5bb8;        /* 藍聯盟：主要互動色 */
  --red: #c4303a;         /* 紅聯盟：只用在今日精選 */
  --chip: #e3e9f0;
  --c-team: #6b5aa6; --c-soft: #1d7a8c; --c-hard: #a8641a; --c-rule: #c4303a; --c-admin: #3d7a2e; --c-other: #6b7682;
  --f-display: "Barlow Condensed", "Noto Sans TC", "Arial Narrow", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --panel: #172029; --ink: #e4eaf0; --muted: #94a2b0; --line: #2a3642;
    --blue: #6aa4f5; --red: #f0626b; --chip: #22303c;
    --c-team: #a99ae0; --c-soft: #5ec3d6; --c-hard: #e3a55a; --c-rule: #f0626b; --c-admin: #86c774; --c-other: #9aa6b2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --panel: #172029; --ink: #e4eaf0; --muted: #94a2b0; --line: #2a3642;
  --blue: #6aa4f5; --red: #f0626b; --chip: #22303c;
  --c-team: #a99ae0; --c-soft: #5ec3d6; --c-hard: #e3a55a; --c-rule: #f0626b; --c-admin: #86c774; --c-other: #9aa6b2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.65; }
a { color: var(--blue); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 頂部 */
.top { border-bottom: 1px solid var(--line); background: var(--panel); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 18px; }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 2.1rem; line-height: 1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.brand h1 b { color: var(--blue); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: .85rem; }
.countdown { display: flex; align-items: baseline; gap: 8px; font-family: var(--f-mono); }
.countdown .n { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.countdown .l { font-size: .75rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; line-height: 1.3; }
.daynav { display: flex; align-items: center; gap: 6px; }
.daynav button, .daynav select { font: inherit; font-family: var(--f-mono); font-size: .85rem; height: 36px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 0 10px; cursor: pointer; }
.daynav button:disabled { opacity: .4; cursor: default; }

main .wrap { display: grid; gap: 28px; padding-block: 24px 48px; }
.label { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

/* 今日精選 */
.pick { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--red); border-radius: 4px 10px 10px 4px; padding: 20px 22px; display: grid; gap: 10px; }
.pick .tag { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; color: var(--red); font-weight: 600; }
.pick h2 { font-size: 1.35rem; line-height: 1.35; margin: 0; text-wrap: balance; }
.pick h2 a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 4px; }
.pick h2 a:hover { text-decoration-color: var(--red); }
.pick .reason { margin: 0; max-width: 68ch; }
.pick .meta { font-size: .82rem; color: var(--muted); }
.actions { margin: 4px 0 0; padding: 12px 14px; background: var(--chip); border-radius: 8px; display: grid; gap: 4px; }
.actions strong { font-size: .85rem; }
.actions ol { margin: 0; padding-left: 1.3em; }

/* 重點整理 */
.headline { font-size: 1.1rem; font-weight: 500; margin: 0 0 14px; max-width: 70ch; }
.hl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.hl { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.hl h3 { margin: 0 0 6px; font-size: .95rem; display: flex; align-items: center; gap: 8px; }
.hl p { margin: 0; color: var(--ink); font-size: .92rem; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cat, var(--c-other)); flex: none; }

/* 全部訊息 */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.chipbtn { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chipbtn .c { font-family: var(--f-mono); font-size: .75rem; opacity: .75; }
.filters input[type=search] { font: inherit; font-size: .9rem; flex: 1 1 200px; min-width: 0; height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: var(--panel); color: var(--ink); }
.toggle { font-size: .85rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.list { display: grid; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.item { display: grid; grid-template-columns: 4px 1fr; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .bar { background: var(--cat, var(--c-other)); }
.item .body { padding: 12px 16px; min-width: 0; display: grid; gap: 4px; }
.item .t { font-weight: 500; overflow-wrap: anywhere; }
.item .t a { color: var(--ink); text-decoration: none; }
.item .t a:hover { color: var(--blue); text-decoration: underline; }
.item .m { font-size: .78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--f-mono); }
.item .s { font-size: .85rem; color: var(--muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.item.is-pick .bar { background: var(--red); }
.pill { font-family: var(--f-body); font-size: .72rem; padding: 0 6px; border-radius: 4px; background: var(--chip); color: var(--ink); }
.pill.old { color: var(--muted); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

.pages { display: grid; gap: 10px; }
.pg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.pg h3 { margin: 0 0 6px; font-size: .95rem; }
.pg ul { margin: 6px 0 0; padding-left: 1.2em; font-size: .88rem; overflow-wrap: anywhere; }
.pg .muted { color: var(--muted); font-size: .85rem; margin: 0; }
.errors { font-size: .85rem; color: var(--muted); }
.errors summary { cursor: pointer; }
footer { color: var(--muted); font-size: .8rem; border-top: 1px solid var(--line); }
footer .wrap { padding-block: 18px 28px; }
@media (max-width: 560px) {
  .brand h1 { font-size: 1.75rem; }
  .countdown .n { font-size: 2rem; }
  .pick { padding: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .pick { animation: rise .35s ease-out both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>FRC <b>2027</b> 情報站</h1>
      <p>每天自動收集 FIRST 官方、WPILib、廠商與 Chief Delphi 上的 2027 賽季變動</p>
    </div>
    <div class="countdown" id="countdown" aria-label="距離 2027 Kickoff 天數">
      <span class="n" id="cd-n">—</span><span class="l">天後<br>2027 Kickoff · 1/9</span>
    </div>
    <nav class="daynav" aria-label="切換日期">
      <button id="prev" type="button" aria-label="前一天">◀</button>
      <select id="day" aria-label="選擇日期"></select>
      <button id="next" type="button" aria-label="後一天">▶</button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section aria-labelledby="pick-l">
      <p class="label" id="pick-l">今日最有價值</p>
      <article class="pick" id="pick"></article>
    </section>

    <section aria-labelledby="sum-l">
      <p class="label" id="sum-l">今日重點整理</p>
      <p class="headline" id="headline"></p>
      <div class="hl-grid" id="highlights"></div>
    </section>

    <section aria-labelledby="all-l">
      <p class="label" id="all-l">全部訊息</p>
      <div class="filters">
        <div id="chips" style="display:contents"></div>
        <input type="search" id="q" placeholder="搜尋標題或摘要…" aria-label="搜尋">
        <label class="toggle"><input type="checkbox" id="showOld"> 顯示首次監控的既有內容</label>
      </div>
      <div class="list" id="list"></div>
    </section>

    <section aria-labelledby="pg-l" id="pg-sec">
      <p class="label" id="pg-l">監控頁面</p>
      <div class="pages" id="pages"></div>
    </section>

    <details class="errors" id="errors" hidden><summary id="err-sum"></summary><ul id="err-list"></ul></details>
  </div>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script type="application/json" id="data">/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var CAT_COLOR = { "隊伍建造紀錄": "--c-team", "軟體更新": "--c-soft", "硬體/控制系統": "--c-hard",
                    "規則/比賽手冊": "--c-rule", "行政/賽事": "--c-admin", "其他": "--c-other" };
  var CAT_ORDER = ["規則/比賽手冊", "軟體更新", "硬體/控制系統", "行政/賽事", "隊伍建造紀錄", "其他"];
  var state = { cat: null, q: "", showOld: false };
  var $ = function (id) { return document.getElementById(id); };

  // 外部內容一律用 textContent，連結只允許 http(s)
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    for (var k in props || {}) {
      if (k === "text") n.textContent = props[k];
      else if (k === "href") { if (/^https?:\/\//i.test(props[k])) { n.href = props[k]; n.target = "_blank"; n.rel = "noopener"; } }
      else if (k === "style") n.setAttribute("style", props[k]);
      else n.setAttribute(k, props[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function catStyle(c) { return "--cat: var(" + (CAT_COLOR[c] || "--c-other") + ")"; }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  function countdown(dateStr) {
    var kick = Date.UTC(2027, 0, 9), d = Date.parse(dateStr + "T00:00:00Z");
    var days = Math.round((kick - d) / 86400000);
    $("cd-n").textContent = days > 0 ? days : "已開始";
  }

  function renderPick(day) {
    var box = $("pick"); clear(box);
    var a = day.analysis || {}, p = a.top_pick;
    if (!p) { box.appendChild(el("p", { class: "reason", text: "今天沒有新的 2027 相關消息。" })); return; }
    box.appendChild(el("span", { class: "tag", text: "TOP PICK · " + (a.method === "claude" ? "由 Claude 挑選" : "規則評分") }));
    box.appendChild(el("h2", {}, [el("a", { href: p.url, text: p.title })]));
    box.appendChild(el("p", { class: "reason", text: p.reason }));
    box.appendChild(el("span", { class: "meta", text: "來源：" + p.source }));
    if (a.action_items && a.action_items.length) {
      var ol = el("ol"); a.action_items.forEach(function (t) { ol.appendChild(el("li", { text: t })); });
      box.appendChild(el("div", { class: "actions" }, [el("strong", { text: "隊伍可以做的事" }), ol]));
    }
  }

  function renderSummary(day) {
    var a = day.analysis || {};
    $("headline").textContent = a.headline || "";
    var g = $("highlights"); clear(g);
    (a.highlights || []).slice().sort(function (x, y) { return CAT_ORDER.indexOf(x.category) - CAT_ORDER.indexOf(y.category); })
      .forEach(function (h) {
        g.appendChild(el("div", { class: "hl", style: catStyle(h.category) }, [
          el("h3", {}, [el("span", { class: "dot" }), h.category]), el("p", { text: h.text })]));
      });
  }

  function visibleItems(day) {
    return (day.result.items || []).filter(function (i) { return state.showOld || !i.baseline; });
  }

  function renderChips(day) {
    var box = $("chips"); clear(box);
    var items = visibleItems(day), counts = {};
    items.forEach(function (i) { var c = i.categories[0]; counts[c] = (counts[c] || 0) + 1; });
    var make = function (label, cat, n) {
      var b = el("button", { class: "chipbtn", type: "button", "aria-pressed": String(state.cat === cat), style: cat ? catStyle(cat) : "" },
        [cat ? el("span", { class: "dot" }) : null, label, el("span", { class: "c", text: String(n) })]);
      b.addEventListener("click", function () { state.cat = cat; renderList(day); renderChips(day); });
      return b;
    };
    box.appendChild(make("全部", null, items.length));
    CAT_ORDER.forEach(function (c) { if (counts[c]) box.appendChild(make(c, c, counts[c])); });
  }

  function renderList(day) {
    var list = $("list"); clear(list);
    var q = state.q.toLowerCase(), pickUrl = day.analysis && day.analysis.top_pick && day.analysis.top_pick.url;
    var items = visibleItems(day).filter(function (i) {
      return (!state.cat || i.categories[0] === state.cat) &&
             (!q || (i.title + " " + (i.summary || "")).toLowerCase().indexOf(q) >= 0);
    });
    items.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    if (!items.length) {
      var oldN = (day.result.items || []).filter(function (i) { return i.baseline; }).length;
      list.appendChild(el("div", { class: "empty", text: oldN && !state.showOld
        ? "今天沒有新消息。勾選「顯示首次監控的既有內容」可看 " + oldN + " 則開始監控時已存在的文章。"
        : "沒有符合條件的訊息。" }));
      return;
    }
    items.forEach(function (i) {
      var meta = el("div", { class: "m" }, [
        el("span", { class: "pill", text: i.categories[0] }), el("span", { text: i.date || "" }), el("span", { text: i.source }),
        i.baseline ? el("span", { class: "pill old", text: "既有內容" }) : null]);
      list.appendChild(el("div", { class: "item" + (i.url === pickUrl ? " is-pick" : ""), style: catStyle(i.categories[0]) }, [
        el("span", { class: "bar" }),
        el("div", { class: "body" }, [el("div", { class: "t" }, [el("a", { href: i.url, text: i.title })]), meta,
          i.summary ? el("p", { class: "s", text: i.summary }) : null])]));
    });
  }

  function renderPages(day) {
    var box = $("pages"); clear(box);
    var pages = day.result.pages || [];
    $("pg-sec").hidden = !pages.length;
    pages.forEach(function (p) {
      var kids = [el("h3", {}, [el("a", { href: p.url, text: p.source })])];
      if (p.baseline) kids.push(el("p", { class: "muted", text: "已建立基準快照，之後有任何更動都會出現在這裡。" }));
      var links = Object.keys(p.new_links || {});
      if (links.length) {
        var ul = el("ul"); links.slice(0, 30).forEach(function (u) { ul.appendChild(el("li", {}, [el("a", { href: u, text: p.new_links[u] })])); });
        kids.push(el("p", { class: "muted", text: (p.baseline ? "目前的 2027 文件" : "新增連結") + "（" + links.length + "）" }), ul);
      }
      if ((p.added || []).length) {
        var ua = el("ul"); p.added.slice(0, 15).forEach(function (t) { ua.appendChild(el("li", { text: t })); });
        kids.push(el("p", { class: "muted", text: "新增內容（" + p.added.length + " 行）" }), ua);
      }
      if ((p.removed || []).length) kids.push(el("p", { class: "muted", text: "刪除內容 " + p.removed.length + " 行" }));
      box.appendChild(el("div", { class: "pg" }, kids));
    });
  }

  function renderErrors(day) {
    var errs = day.result.errors || [];
    $("errors").hidden = !errs.length;
    $("err-sum").textContent = errs.length + " 個來源今天抓取失敗";
    var ul = $("err-list"); clear(ul);
    errs.forEach(function (e) { ul.appendChild(el("li", { text: e.source + "：" + e.error })); });
  }

  function show(idx) {
    var day = DATA.days[idx];
    if (!day) return;
    $("day").value = String(idx);
    // 當天沒有新消息（例如第一天建立基準）就直接顯示全部內容
    state.showOld = !(day.result.items || []).some(function (i) { return !i.baseline; });
    $("showOld").checked = state.showOld; state.cat = null;
    $("prev").disabled = idx >= DATA.days.length - 1;
    $("next").disabled = idx <= 0;
    countdown(day.date);
    renderPick(day); renderSummary(day); renderChips(day); renderList(day); renderPages(day); renderErrors(day);
    var a = day.analysis || {};
    $("foot").textContent = "資料日期 " + day.date + " · 精選與整理：" +
      (a.method === "claude" ? "Claude（" + (a.model || "") + "）判讀" : "規則評分") +
      " · 內容摘錄自原始來源，請以官方文件為準。";
    try { history.replaceState(null, "", "#d" + day.date); } catch (e) {}
  }

  function indexFromHash() {
    var m = /^#d(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
    if (!m) return 0;
    for (var i = 0; i < DATA.days.length; i++) if (DATA.days[i].date === m[1]) return i;
    return 0;
  }

  if (!DATA.days.length) { $("pick").appendChild(el("p", { text: "還沒有資料，爬蟲第一次執行後就會出現。" })); return; }
  DATA.days.forEach(function (d, i) { $("day").appendChild(el("option", { value: String(i), text: d.date })); });
  $("day").addEventListener("change", function (e) { show(+e.target.value); });
  $("prev").addEventListener("click", function () { show(+$("day").value + 1); });
  $("next").addEventListener("click", function () { show(+$("day").value - 1); });
  $("q").addEventListener("input", function (e) { state.q = e.target.value; renderList(DATA.days[+$("day").value]); });
  $("showOld").addEventListener("change", function (e) {
    state.showOld = e.target.checked; state.cat = null; var d = DATA.days[+$("day").value]; renderChips(d); renderList(d);
  });
  window.addEventListener("hashchange", function () { show(indexFromHash()); });
  show(indexFromHash());
})();
</script>
