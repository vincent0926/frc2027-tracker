name: FRC 2027 每日追蹤

on:
  schedule:
    - cron: "17 23 * * *"   # 每天 UTC 23:17 = 台灣時間早上 07:17
  workflow_dispatch:         # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write            # 需要把新的報告 commit 回 repo

concurrency:
  group: frc2027-tracker
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 執行爬蟲
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # 選用
        run: python -m tracker.main --date "$(TZ=Asia/Taipei date +%F)"
      - name: 提交報告與快照
        run: |
          git config user.name "frc2027-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "每日報告 $(TZ=Asia/Taipei date +%F)"
          git push
